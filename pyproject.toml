[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashfox"
version = "0.1.0"
description = "HashFox — Smart Hash Intelligence & Pentest Assistant (offline)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
hashfox = "backend.cli:main"

[tool.setuptools]
packages = ["backend", "database", "frontend"]

[tool.setuptools.package-data]
database = ["hashes.json"]
frontend = ["*.html", "*.css", "*.js", "*.svg"]
